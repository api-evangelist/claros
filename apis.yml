aid: claros
name: Claros
description: >-
  Claros is a data center power delivery company reimagining how energy moves
  from chip to grid for AI and high-performance computing infrastructure. Based
  in Torrance, California with an office in McLean, Virginia, the company builds
  two hardware-and-software product lines: an Integrated Voltage Regulator (IVR)
  that targets the roughly 40 percent of chip power lost to heat at the point of
  delivery, and a Power Gateway that manages broader data center power
  distribution where 30 to 50 percent of power is lost to transmission,
  conversion, and cooling. Claros is an early-stage hardware company backed by
  General Catalyst and Red Cell Partners; its founding team collectively holds
  286 patents and has brought more than 80 gigawatts of projects to market. As
  of 2026 it is pre-product (prototypes in development, engineering samples
  planned for 2026, low-volume production 2027, high-volume scale 2028) and
  publishes no developer API, SDK, or public documentation surface yet — this
  profile captures its public identity for the API Evangelist network.
